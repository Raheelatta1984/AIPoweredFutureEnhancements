name: Enhancement intake

# Opens exactly one durable issue per handover document. The issue body carries a
# hidden `<!-- handover: <path> -->` marker so re-runs update instead of duplicating,
# plus a ready-to-paste Arena Agent Mode prompt.

on:
  push:
    branches: [main]
    paths:
      - "handovers/*/ENH-*.md"
      - "handovers/*/*/ENH-*.md"
  workflow_dispatch:
    inputs:
      path:
        description: "Optional single handover path (blank = scan all)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: enhancement-intake
  cancel-in-progress: false

jobs:
  intake:
    name: Open handover issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only ever run against the default branch so a feature branch cannot spam issues.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Intake handover documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HANDOVER_GLOB: "handovers/*/ENH-*.md,handovers/*/*/ENH-*.md"
          SINGLE_PATH: ${{ inputs.path }}
          ASSIGNEE: ""
          LABEL: arena-handover
        run: node scripts/enhancement-intake.mjs
